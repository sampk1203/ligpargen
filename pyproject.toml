[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ligpargen"
version = "2.1"
description = "A new version of the ligpargen including alchemical transformations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Israel Cabeza de Vaca Lopez", email = "israel.cabezadevaca@icm.uu.se" }]
keywords = ["OPLS", "OPLSAA", "CM1A", "CM1A-LBCC"]
dependencies = [
    "numpy",
    "markdown",
    "rdkit>=2026.9.1",
    "openbabel-wheel",
]

[project.urls]
Homepage = "https://github.com/sampk1203/ligpargen"

[project.scripts]
ligpargen = "ligpargen.ligpargen:main"
molpargen = "ligpargen.tools.pipeline_cli:main"

[tool.setuptools.packages.find]
include = ["ligpargen*"]
